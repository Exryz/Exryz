name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Base metrics (overview, activity, community)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, metadata
          config_timezone: Asia/Manila

      - name: Featured repositories
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Manila
          plugin_repositories: yes
          plugin_repositories_featured: Exryz/helpdesk-agent, Exryz/docextract

      - name: Languages breakdown
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Manila
          plugin_languages: yes
          plugin_languages_ignored: html, css, dockerfile, jinja
          plugin_languages_details: percentage
          plugin_languages_limit: 6

      - name: Contribution isocalendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Manila
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
